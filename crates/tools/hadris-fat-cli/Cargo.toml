[package]
name = "hadris-fat-cli"
version = "2.4.0"
description = "CLI utility for FAT12/16/32 and exFAT filesystem analysis and management"
readme = "README.md"
keywords = ["fat", "fat32", "exfat", "filesystem", "cli"]
categories = ["command-line-utilities", "filesystem"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "hadris-fat"
path = "src/bin/hadris-fat.rs"
doc = false

[[bin]]
name = "fatutil"
path = "src/bin/fatutil.rs"
doc = false

[dependencies]
hadris-fat = { workspace = true, features = ["std", "sync", "write"] }
hadris-fs = { workspace = true, features = ["std", "sync"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
bytemuck.workspace = true
clap.workspace = true
anyhow.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
