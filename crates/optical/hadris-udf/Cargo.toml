[package]
name = "hadris-udf"
autotests = false
version = "3.0.0-rc.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Pure Rust UDF library with allocation-free reading and a writer for standalone and ISO 9660 bridge volumes"
keywords = ["udf", "disk-image", "optical-disc", "filesystem", "no-std"]
categories = ["filesystem", "embedded", "no-std"]

[package.metadata.docs.rs]
features = ["std", "sync", "async", "bridge", "tracing"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync", "write"]
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc"]
# Implies `alloc`; `std::io::Error` conversions and host files as tree content.
std = ["alloc", "hadris-io/std", "hadris-fs/std", "hadris-storage/std", "hadris-iso?/std", "tracing?/std"]
# Implies `alloc`; the writer, `plan` and `UdfOptions`.
write = ["alloc"]
# Implies `write`; the ISO 9660 and UDF bridge writer, through `hadris-iso`.
bridge = ["write", "dep:hadris-iso", "hadris-iso/write"]
sync = ["hadris-io/sync", "hadris-fs/sync", "hadris-storage/sync", "hadris-iso?/sync"]
async = ["hadris-io/async", "hadris-fs/async", "hadris-storage/async", "hadris-iso?/async"]

tracing = ["dep:tracing", "hadris-iso?/tracing"]

[dependencies]
hadris-udf-raw = { workspace = true }
tracing = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
hadris-io = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true }
hadris-iso = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["unstable-contract"] }
hadris-part = { workspace = true, features = ["std", "sync"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
tempfile.workspace = true

[[test]]
name = "roundtrip"
required-features = ["std", "sync", "write"]

[[test]]
name = "contract"
required-features = ["std", "sync", "write"]

[[test]]
name = "errors"
required-features = ["std", "sync", "write"]

[[test]]
name = "read"
required-features = ["std", "sync", "write"]

[[test]]
name = "interop"
required-features = ["std", "sync", "bridge"]

[[test]]
name = "bridge"
required-features = ["std", "sync", "async", "bridge"]

[[bench]]
name = "performance"
harness = false
required-features = ["std", "sync", "write"]

[[bench]]
name = "kernels"
harness = false
required-features = ["std", "sync", "write"]

[[test]]
name = "unified_async"
required-features = ["std", "sync", "async", "bridge"]

[lints]
workspace = true
