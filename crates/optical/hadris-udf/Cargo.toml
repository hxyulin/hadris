[package]
name = "hadris-udf"
autotests = false
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Pure Rust UDF library with allocation-free reading and a writer for standalone and ISO 9660 bridge volumes"
keywords = ["udf", "disk-image", "optical-disc", "filesystem", "no-std"]
categories = ["filesystem", "embedded", "no-std"]

[package.metadata.docs.rs]
features = ["std", "sync", "async"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
# The writer and the tree input.
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc"]
# Implies `alloc`; `std::io::Error` conversions and host files as tree content.
std = ["alloc", "hadris-io/std", "hadris-fs/std", "hadris-storage/std"]
sync = ["hadris-io/sync", "hadris-fs/sync", "hadris-storage/sync"]
async = ["hadris-io/async", "hadris-fs/async", "hadris-storage/async"]

[dependencies]
bitflags = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
hadris-io = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["contract"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
tempfile.workspace = true

[[test]]
name = "roundtrip"
required-features = ["std", "sync"]

[[test]]
name = "contract"
required-features = ["std", "sync"]

[[test]]
name = "errors"
required-features = ["std", "sync"]

[[test]]
name = "read"
required-features = ["std", "sync"]

[[test]]
name = "interop"
required-features = ["std", "sync"]
