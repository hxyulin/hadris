[package]
name = "hadris-optical"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Detection and opening of ISO 9660 and UDF images on Hadris block devices"
keywords = ["iso9660", "udf", "optical", "cd", "dvd"]
categories = ["filesystem", "encoding"]

[package.metadata.docs.rs]
features = ["std", "sync", "async", "cd"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
# `PathError` conversions, and the writers of `iso` and `udf`.
alloc = ["hadris-fs/alloc", "hadris-storage/alloc", "hadris-iso/alloc", "hadris-udf/alloc"]
# Implies `alloc`; `std::io::Error` conversions.
std = ["alloc", "hadris-fs/std", "hadris-storage/std", "hadris-iso/std", "hadris-udf/std", "hadris-cd?/std"]
sync = ["hadris-fs/sync", "hadris-storage/sync", "hadris-iso/sync", "hadris-udf/sync", "hadris-cd?/sync"]
async = ["hadris-fs/async", "hadris-storage/async", "hadris-iso/async", "hadris-udf/async", "hadris-cd?/async"]
# The `cd` re-export, the hybrid ISO 9660 and UDF writer.
cd = ["alloc", "dep:hadris-cd"]

[dependencies]
hadris-fs = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-iso = { workspace = true, default-features = false }
hadris-udf = { workspace = true, default-features = false }
hadris-cd = { workspace = true, optional = true, default-features = false }
hadris-macros = { workspace = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["std", "sync", "async", "contract"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
hadris-cd = { workspace = true, features = ["std", "sync"] }

[[test]]
name = "detect"
required-features = ["std", "sync", "cd"]

[[test]]
name = "open_image"
required-features = ["std", "sync", "cd"]

[[test]]
name = "async_open_image"
required-features = ["std", "sync", "cd"]
