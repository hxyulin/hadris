[package]
name = "hadris-optical"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Hadris facade for optical filesystems and disc images"
keywords = ["iso9660", "udf", "optical", "cd", "dvd"]
categories = ["filesystem", "encoding"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync", "read", "write", "open", "cd"]
std = ["alloc", "hadris-io?/std", "hadris-iso?/std", "hadris-udf?/std", "hadris-cd?/std"]
alloc = ["hadris-io?/alloc", "hadris-iso?/alloc", "hadris-udf?/alloc"]
sync = ["hadris-io?/sync", "hadris-iso?/sync", "hadris-udf?/sync", "hadris-cd?/sync", "hadris-storage?/sync"]
async = ["hadris-io?/async", "hadris-iso?/async", "hadris-udf?/async", "hadris-cd?/async", "hadris-storage?/async"]
# The `async_send` mode of the format crates.
async-send = ["async", "hadris-iso?/async-send", "hadris-udf?/async-send", "hadris-cd?/async-send", "hadris-storage?/async-send"]
read = []
write = ["alloc", "read"]
detect = ["read", "dep:hadris-io"]
open = ["detect", "alloc", "iso", "udf"]
iso = ["dep:hadris-iso", "dep:hadris-storage"]
udf = ["dep:hadris-udf", "dep:hadris-storage"]
cd = ["dep:hadris-cd"]

[dependencies]
hadris-io = { workspace = true, optional = true, default-features = false }
hadris-iso = { workspace = true, optional = true, default-features = false }
hadris-storage = { workspace = true, optional = true, default-features = false }
hadris-udf = { workspace = true, optional = true, default-features = false }
hadris-cd = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["std", "sync", "async"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
