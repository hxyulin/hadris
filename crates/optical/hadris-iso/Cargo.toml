[package]
name = "hadris-iso"
autotests = false
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Pure Rust ISO 9660 library with allocation-free reading, Joliet, Rock Ridge, El Torito, hybrid boot and sessions"
keywords = ["iso9660", "joliet", "rock-ridge", "el-torito", "no-std"]
categories = ["filesystem", "embedded", "no-std"]
exclude = ["/spec"]

[package.metadata.docs.rs]
features = ["std", "sync", "async", "async-send"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
# The writer, sessions, the boot catalog reader and the tree input.
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc", "dep:hadris-part", "hadris-part/alloc"]
# Implies `alloc`; `std::io::Error` conversions and host files as tree content.
std = ["alloc", "hadris-io/std", "hadris-fs/std", "hadris-storage/std", "hadris-part/std"]
sync = ["hadris-io/sync", "hadris-fs/sync", "hadris-storage/sync", "hadris-part?/sync"]
async = ["hadris-io/async", "hadris-fs/async", "hadris-storage/async", "hadris-part?/async"]
# The asynchronous API a third time, with `Send` futures, in `async_send`.
async-send = ["async", "hadris-io/async-send", "hadris-fs/async-send", "hadris-storage/async-send", "hadris-part?/async-send"]

[dependencies]
bitflags = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
hadris-io = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true }
hadris-part = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["contract"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
tempfile.workspace = true

[[test]]
name = "roundtrip"
required-features = ["std", "sync", "async-send"]

[[test]]
name = "contract"
required-features = ["std", "sync", "async-send"]

[[test]]
name = "sessions"
required-features = ["std", "sync", "async-send"]

[[test]]
name = "errors"
required-features = ["std", "sync"]

[[test]]
name = "multi_extent"
required-features = ["std", "sync"]
