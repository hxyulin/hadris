[package]
name = "hadris-iso"
autotests = false
version = "3.0.0-rc.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Pure Rust ISO 9660 library with allocation-free reading, Joliet, Rock Ridge, El Torito, hybrid boot and sessions"
keywords = ["iso9660", "joliet", "rock-ridge", "el-torito", "no-std"]
categories = ["filesystem", "embedded", "no-std"]
exclude = ["/spec"]

[package.metadata.docs.rs]
features = ["std", "sync", "async", "write", "tracing"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync", "write"]
# The bounded reader metadata caches and `CacheOptions`.
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc"]
# Implies `alloc`; `std::io::Error` conversions and host files as tree content.
std = ["alloc", "hadris-io/std", "hadris-fs/std", "hadris-storage/std", "hadris-part?/std", "tracing?/std"]
# Implies `alloc`; the writer, `plan`, `Session` and their options.
write = ["alloc", "dep:hadris-part", "hadris-part/alloc"]
sync = ["hadris-io/sync", "hadris-fs/sync", "hadris-storage/sync", "hadris-part?/sync"]
async = ["hadris-io/async", "hadris-fs/async", "hadris-storage/async", "hadris-part?/async"]

tracing = ["dep:tracing", "hadris-part?/tracing"]

[dependencies]
hadris-iso-raw = { workspace = true }
tracing = { workspace = true, optional = true }
bitflags = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
hadris-io = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true }
hadris-part = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
static_assertions = { workspace = true }
hadris-fs = { workspace = true, features = ["unstable-contract"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
tempfile.workspace = true

[[test]]
name = "roundtrip"
required-features = ["std", "sync", "write"]

[[test]]
name = "contract"
required-features = ["std", "sync", "write"]

[[test]]
name = "sessions"
required-features = ["std", "sync", "write"]

[[test]]
name = "errors"
required-features = ["std", "sync", "write"]

[[test]]
name = "multi_extent"
required-features = ["std", "sync", "write"]

[[test]]
name = "malformed"
required-features = ["std", "sync"]

[[test]]
name = "performance"
required-features = ["std", "sync", "write"]

[[bench]]
name = "performance"
harness = false
required-features = ["std", "sync", "write"]

[[test]]
name = "versions"
required-features = ["std", "sync", "write"]

[[test]]
name = "raw_compat"

[[test]]
name = "unified_async"
required-features = ["std", "sync", "async", "write"]

[[test]]
name = "unified_write"
required-features = ["std", "sync", "async", "write"]

[lints]
workspace = true
