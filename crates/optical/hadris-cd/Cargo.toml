[package]
name = "hadris-cd"
autotests = false
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Hybrid ISO 9660 and UDF optical disc images (UDF Bridge) from one input tree"
keywords = ["iso9660", "udf", "optical", "cd", "dvd"]
categories = ["filesystem", "encoding", "no-std"]

[package.metadata.docs.rs]
features = ["std", "sync", "async"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
# `std::io::Error` conversions and host files as tree content.
std = ["hadris-fs/std", "hadris-iso/std", "hadris-udf/std", "hadris-storage/std"]
sync = ["hadris-fs/sync", "hadris-iso/sync", "hadris-udf/sync", "hadris-storage/sync"]
async = ["hadris-fs/async", "hadris-iso/async", "hadris-udf/async", "hadris-storage/async"]

[dependencies]
hadris-fs = { workspace = true, default-features = false, features = ["alloc"] }
hadris-iso = { workspace = true, default-features = false, features = ["alloc"] }
hadris-udf = { workspace = true, default-features = false, features = ["alloc"] }
hadris-storage = { workspace = true, default-features = false, features = ["alloc"] }
hadris-macros = { workspace = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["std", "sync"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }

[[test]]
name = "bridge"
required-features = ["std", "sync"]
