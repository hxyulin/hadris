[package]
name = "hadris-block"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Detection and opening of FAT and NTFS volumes on Hadris block devices"
keywords = ["block-device", "storage", "partition", "filesystem", "no-std"]
categories = ["no-std", "filesystem"]

[package.metadata.docs.rs]
features = ["std", "sync", "async", "write", "part", "unstable-ntfs"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
# `PathError` conversions.
alloc = ["hadris-storage/alloc", "hadris-fs/alloc", "hadris-fat/alloc", "hadris-ntfs/alloc", "hadris-part?/alloc"]
# Implies `alloc`; `std::io::Error` conversions.
std = ["alloc", "hadris-storage/std", "hadris-fs/std", "hadris-fat/std", "hadris-ntfs/std", "hadris-part?/std"]
sync = ["hadris-storage/sync", "hadris-fs/sync", "hadris-fat/sync", "hadris-ntfs/sync", "hadris-part?/sync"]
async = ["hadris-storage/async", "hadris-fs/async", "hadris-fat/async", "hadris-ntfs/async", "hadris-part?/async"]
# FAT formatting through the `fat` re-export.
write = ["hadris-fat/write"]
# The `part` re-export.
part = ["dep:hadris-part"]
# The `ntfs` re-export and `OpenVolume`'s NTFS driver; NTFS is a preview.
unstable-ntfs = []

[dependencies]
hadris-storage = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-fat = { workspace = true, default-features = false }
hadris-ntfs = { workspace = true, default-features = false }
hadris-part = { workspace = true, optional = true, default-features = false }
hadris-macros = { workspace = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["std", "sync", "async", "contract"] }
hadris-fat = { workspace = true, features = ["write"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
hadris-ntfs = { workspace = true }

[[test]]
name = "open_volume"
required-features = ["std", "sync", "write", "part"]

[[test]]
name = "async_volume"
required-features = ["std", "async", "write", "part"]

[[test]]
name = "async_send_volume"
required-features = ["std", "write", "part"]
