[package]
name = "hadris-block"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Rust block-storage facade for devices, sectors, partitions, and FAT filesystems"
keywords = ["block-device", "storage", "partition", "filesystem", "no-std"]
categories = ["no-std", "filesystem"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync", "read", "write", "detect", "storage", "fat", "part"]
std = ["alloc", "hadris-storage?/std", "hadris-fs?/std", "hadris-fat?/std", "hadris-part?/std"]
alloc = ["hadris-storage?/alloc", "hadris-fs?/alloc", "hadris-fat?/alloc", "hadris-part?/alloc"]
sync = ["hadris-storage?/sync", "hadris-fs?/sync", "hadris-fat?/sync", "hadris-part?/sync"]
async = ["hadris-storage?/async", "hadris-fs?/async", "hadris-fat?/async", "hadris-part?/async"]
async-send = ["async", "hadris-storage?/async-send", "hadris-fs?/async-send", "hadris-fat?/async-send"]
read = ["hadris-part?/read"]
write = ["alloc", "read", "hadris-fat?/write", "hadris-part?/write"]
detect = ["read", "dep:hadris-storage"]
storage = ["dep:hadris-storage"]
fat = ["dep:hadris-fat", "dep:hadris-fs", "dep:hadris-storage"]
part = ["dep:hadris-part"]

[dependencies]
hadris-storage = { workspace = true, optional = true, default-features = false }
hadris-fs = { workspace = true, optional = true, default-features = false }
hadris-fat = { workspace = true, optional = true, default-features = false }
hadris-part = { workspace = true, optional = true, default-features = false }
hadris-macros = { workspace = true }

[dev-dependencies]
bytemuck.workspace = true
hadris-io = { workspace = true, features = ["std", "sync", "async"] }
