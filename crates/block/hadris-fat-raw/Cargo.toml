[package]
name = "hadris-fat-raw"
version = "0.2.0"
description = "FAT12/16/32 and exFAT on-disk layouts and I/O-free codecs for Hadris and custom drivers"
readme = "README.md"
keywords = ["fat", "exfat", "filesystem", "no-std"]
categories = ["no-std", "filesystem", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The device primitives in `io::sync`.
sync = ["dep:hadris-storage", "dep:hadris-macros", "hadris-storage/sync"]
# Unified asynchronous device primitives.
async = ["dep:hadris-storage", "dep:hadris-macros", "hadris-storage/async"]
# Derives `defmt::Format` on `FatKind`.
defmt = ["dep:defmt"]

[package.metadata.docs.rs]
features = ["sync", "async"]

[dependencies]
hadris-common = { workspace = true, features = ["bytemuck"] }
hadris-fs = { workspace = true }
hadris-macros = { workspace = true, optional = true }
hadris-storage = { workspace = true, optional = true }

bytemuck = { workspace = true, features = [
  "derive",
  "min_const_generics",
] }
defmt = { version = "1.0", optional = true }

[dev-dependencies]
hadris-io = { workspace = true }
hadris-storage = { workspace = true, features = ["sync", "alloc"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[test]]
name = "io"
required-features = ["sync"]

[[test]]
name = "block_io"
required-features = ["sync"]

[[test]]
name = "fat12_recovery"
required-features = ["sync"]
