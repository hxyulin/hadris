[package]
name = "hadris-fat"
autotests = false
version = "2.4.0"
description = "Rust FAT12/FAT16/FAT32 filesystem library for disk images, embedded devices, and no-std"
readme = "README.md"
keywords = ["fat", "fat32", "vfat", "filesystem", "no-std"]
categories = ["no-std", "filesystem"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# docs.rs builds with default features only, which would hide the async
# modes. Build every mode.
[package.metadata.docs.rs]
features = ["std", "sync", "async", "write"]

[features]
default = ["std", "sync", "write"]
sync = ["hadris-io/sync", "hadris-fs/sync", "hadris-storage/sync", "hadris-fat-raw/sync"]
async = ["hadris-io/async", "hadris-fs/async", "hadris-storage/async", "hadris-fat-raw/async"]
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc"]
std = [
  "alloc",
  "hadris-io/std",
  "hadris-fs/std",
  "hadris-storage/std",
]
# `format` in each mode. `FatFs` and `ExFatFs` read and write without it.
write = []
# Derives `defmt::Format` on `FatKind` so it can be logged through
# `defmt::info!` etc. without going through `Debug`.
defmt = ["hadris-fat-raw/defmt"]

[dependencies]
hadris-common = { workspace = true, features = ["bytemuck"] }
hadris-fat-raw = { workspace = true }
hadris-io = { workspace = true }
hadris-fs = { workspace = true }
hadris-storage = { workspace = true }
hadris-macros = { workspace = true }

bytemuck = { workspace = true, features = [
  "derive",
  "min_const_generics",
] }

[dev-dependencies]
hadris-fat-raw = { workspace = true, features = ["sync"] }
hadris-fs = { workspace = true, features = ["contract"] }
pretty_assertions = "1.4.1"
static_assertions = "1.1.0"
tempfile = "3"

[[test]]
name = "fatfs_read"
required-features = ["std", "sync", "write"]

[[test]]
name = "fatfs_async"
required-features = ["std", "sync", "async", "write"]

[[test]]
name = "fatfs_write"
required-features = ["std", "sync", "write"]

[[test]]
name = "fatfs_format"
required-features = ["std", "sync", "write"]

[[test]]
name = "fatfs_check"
required-features = ["std", "sync", "async", "write"]

[[test]]
name = "fatfs_contract"
required-features = ["std", "sync", "async", "write"]

[[test]]
name = "exfat_contract"
required-features = ["std", "sync", "async", "write"]

[[test]]
name = "exfat_async"
required-features = ["std", "sync", "async", "write"]

[[test]]
name = "exfat_format"
required-features = ["std", "sync", "write"]

[[test]]
name = "exfat_read"
required-features = ["std", "sync", "write"]

[[test]]
name = "exfat_write"
required-features = ["std", "sync", "write"]

[[test]]
name = "exfat_check"
required-features = ["std", "sync", "write"]

[[test]]
name = "exfat_native"
required-features = ["std", "sync", "write"]

[[test]]
name = "fatfs_scale"
required-features = ["std", "sync", "async", "write"]

[[test]]
name = "exfat_scale"
required-features = ["std", "sync", "async", "write"]
