[package]
name = "hadris-fat"
autotests = false
version = "2.4.0"
description = "Rust FAT12/FAT16/FAT32 filesystem library for disk images, embedded devices, and no-std"
readme = "README.md"
keywords = ["fat", "fat32", "vfat", "filesystem", "no-std"]
categories = ["no-std", "filesystem"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# docs.rs builds with default features only, which would hide the async
# modes. Build every stable mode; the unstable exFAT preview remains
# deliberately opt-in.
[package.metadata.docs.rs]
features = ["std", "sync", "async", "async-send", "write"]

[features]
default = ["std", "sync", "write"]
sync = ["hadris-io/sync", "hadris-fs/sync", "hadris-storage/sync"]
async = ["hadris-io/async", "hadris-fs/async", "hadris-storage/async"]
# The asynchronous API a third time, with `Send` futures, in `async_send`.
async-send = ["async", "hadris-io/async-send", "hadris-fs/async-send", "hadris-storage/async-send"]
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc"]
std = [
  "alloc",
  "hadris-io/std",
  "hadris-fs/std",
  "hadris-storage/std",
]
# `format` in each mode. `FatFs` reads and writes without it.
write = []
# Unstable exFAT preview. It is outside the stability promise, uses the
# synchronous legacy I/O traits, and therefore selects the sync API.
unstable-exfat = ["alloc", "sync"]
# Derives `defmt::Format` on `FatKind` and `Finding` so they can be logged
# through `defmt::info!` etc. without going through `Debug`.
defmt = ["dep:defmt"]

[dependencies]
hadris-common = { workspace = true }
hadris-io = { workspace = true }
hadris-fs = { workspace = true }
hadris-storage = { workspace = true }
hadris-macros = { workspace = true }
spin.workspace = true

bitflags = { workspace = true }
bytemuck = { workspace = true, features = [
  "derive",
  "min_const_generics",
] }
defmt = { version = "1.0", optional = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["contract"] }
pretty_assertions = "1.4.1"
static_assertions = "1.1.0"
tempfile = "3"

[[test]]
name = "exfat_upcase_dos"
required-features = ["unstable-exfat"]

[[test]]
name = "exfat_roundtrip"
required-features = ["unstable-exfat", "write"]

[[test]]
name = "fatfs_read"
required-features = ["std", "sync", "write"]

[[test]]
name = "fatfs_async"
required-features = ["std", "sync", "async-send", "write"]

[[test]]
name = "fatfs_write"
required-features = ["std", "sync", "write"]

[[test]]
name = "fatfs_format"
required-features = ["std", "sync", "write"]

[[test]]
name = "fatfs_check"
required-features = ["std", "sync", "async-send", "write"]

[[test]]
name = "fatfs_contract"
required-features = ["std", "sync", "async-send", "write"]
