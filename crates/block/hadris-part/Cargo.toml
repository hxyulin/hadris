[package]
name = "hadris-part"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Partition table support for MBR, GPT, and Hybrid MBR"
readme = "README.md"
keywords = ["partition", "mbr", "gpt", "disk", "no-std"]
categories = ["no-std", "filesystem"]

[features]
default = ["std", "sync"]
# `Disk`, `PartitionTable`, the `Mbr`, `Gpt` and `Hybrid` tables, `DiskLayout`,
# and `read`, `write` and `create` in each mode.
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc"]
# Implies `alloc`; adds `Guid::random` and `std::io::Error` conversions.
std = ["alloc", "hadris-io/std", "hadris-fs/std", "hadris-storage/std"]
sync = ["hadris-io/sync", "hadris-storage/sync"]
async = ["hadris-io/async", "hadris-storage/async"]

[package.metadata.docs.rs]
features = ["std", "sync", "async"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
hadris-io = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true }
bitflags = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }

[dev-dependencies]
hadris-storage = { workspace = true, features = ["std", "sync"] }

[[test]]
name = "modes"
required-features = ["std", "sync"]

[[test]]
name = "roundtrip"
required-features = ["std", "sync"]

[[test]]
name = "edits"
required-features = ["std", "sync"]

[[test]]
name = "read"
required-features = ["std", "sync"]
