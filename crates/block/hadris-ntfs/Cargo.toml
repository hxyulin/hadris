[package]
name = "hadris-ntfs"
autotests = false
version = "2.4.0"
description = "A read-only NTFS reader that needs no allocator"
readme = "README.md"
keywords = ["ntfs", "filesystem", "no-std"]
categories = ["no-std", "filesystem"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
features = ["std", "sync", "async", "async-send"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
# `AnyError` conversions.
alloc = ["hadris-io/alloc", "hadris-fs/alloc", "hadris-storage/alloc"]
# Implies `alloc`; `std::io::Error` conversions.
std = ["alloc", "hadris-io/std", "hadris-fs/std", "hadris-storage/std"]
sync = ["hadris-io/sync", "hadris-fs/sync", "hadris-storage/sync"]
async = ["hadris-io/async", "hadris-fs/async", "hadris-storage/async"]
# The asynchronous API a third time, with `Send` futures, in `async_send`.
async-send = ["async", "hadris-io/async-send", "hadris-fs/async-send", "hadris-storage/async-send"]

[dependencies]
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
hadris-io = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["contract"] }
hadris-storage = { workspace = true, features = ["std", "sync"] }
tempfile = { workspace = true }

[[test]]
name = "read"
required-features = ["std", "sync"]

[[test]]
name = "crafted"
required-features = ["std", "sync", "async-send"]
