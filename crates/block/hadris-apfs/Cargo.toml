[package]
name = "hadris-apfs"
version = "3.0.0-rc.2"
description = "An experimental, read-only APFS container and filesystem reader"
readme = "README.md"
keywords = ["apfs", "filesystem", "apple", "disk"]
categories = ["filesystem", "no-std"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
features = ["std", "sync", "async", "encryption", "tracing"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
std = ["alloc", "hadris-io/std", "hadris-storage/std", "hadris-fs/std", "tracing?/std"]
alloc = ["hadris-fs/alloc", "hadris-storage/alloc", "dep:icu_casemap", "dep:icu_normalizer"]
encryption = ["alloc", "dep:aes", "dep:aes-kw", "dep:xts-mode", "dep:pbkdf2", "dep:sha2", "dep:hmac", "dep:zeroize"]
sync = ["hadris-io/sync", "hadris-storage/sync", "hadris-fs/sync"]
async = ["hadris-io/async", "hadris-storage/async", "hadris-fs/async"]

tracing = ["dep:tracing"]

[dependencies]
tracing = { workspace = true, optional = true }
hadris-io.workspace = true
hadris-storage.workspace = true
hadris-fs.workspace = true
hadris-macros.workspace = true

aes = { version = "=0.9.2", default-features = false, features = ["zeroize"], optional = true }
aes-kw = { version = "0.3", default-features = false, features = ["zeroize"], optional = true }
xts-mode = { version = "0.6", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
zeroize = { version = "1.8", default-features = false, features = ["alloc"], optional = true }

icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["unstable-contract"] }

[[test]]
name = "driver"
required-features = ["sync", "alloc"]

[[test]]
name = "driver_async"
required-features = ["async", "alloc"]

[[test]]
name = "encryption_validation"
required-features = ["sync", "alloc"]

[[test]]
name = "multi_level_tree"
required-features = ["sync", "alloc"]

[[test]]
name = "multi_level_tree_async"
required-features = ["async", "alloc"]

[[test]]
name = "unified_async"
required-features = ["async", "alloc"]

[[test]]
name = "macos_images"
required-features = ["std", "sync"]

[[test]]
name = "encryption_macos"
required-features = ["encryption", "std"]
