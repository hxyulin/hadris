[package]
name = "hadris"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
description = "A unified Rust storage toolkit for filesystems, partitions, archives, and disk images"
keywords = ["filesystem", "disk-image", "fat32", "iso9660", "no-std"]
categories = ["filesystem", "embedded", "no-std"]

[package.metadata.docs.rs]
features = ["std", "sync", "async", "async-send", "write", "block", "optical", "archive", "unstable-ntfs"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync", "write", "fat", "iso", "cpio"]
std = ["alloc", "hadris-io/std", "hadris-storage/std", "hadris-fs/std", "hadris-fat?/std", "hadris-part?/std", "hadris-ntfs?/std", "hadris-iso?/std", "hadris-udf?/std", "hadris-cd?/std", "hadris-cpio?/std", "hadris-block?/std", "hadris-optical?/std"]
alloc = ["hadris-io/alloc", "hadris-storage/alloc", "hadris-fs/alloc", "hadris-fat?/alloc", "hadris-part?/alloc", "hadris-ntfs?/alloc", "hadris-iso?/alloc", "hadris-udf?/alloc", "hadris-cpio?/alloc", "hadris-block?/alloc", "hadris-optical?/alloc"]
sync = ["hadris-io/sync", "hadris-storage/sync", "hadris-fs/sync", "hadris-fat?/sync", "hadris-part?/sync", "hadris-ntfs?/sync", "hadris-iso?/sync", "hadris-udf?/sync", "hadris-cd?/sync", "hadris-cpio?/sync", "hadris-block?/sync", "hadris-optical?/sync"]
async = ["hadris-io/async", "hadris-storage/async", "hadris-fs/async", "hadris-fat?/async", "hadris-part?/async", "hadris-ntfs?/async", "hadris-iso?/async", "hadris-udf?/async", "hadris-cd?/async", "hadris-cpio?/async", "hadris-block?/async", "hadris-optical?/async"]
# The asynchronous API a third time, with `Send` futures, in `async_send`.
async-send = ["async", "hadris-io/async-send", "hadris-storage/async-send", "hadris-fs/async-send", "hadris-fat?/async-send", "hadris-part?/async-send", "hadris-ntfs?/async-send", "hadris-iso?/async-send", "hadris-udf?/async-send", "hadris-cd?/async-send", "hadris-cpio?/async-send", "hadris-block?/async-send", "hadris-optical?/async-send"]
# FAT formatting.
write = ["hadris-fat?/write", "hadris-block?/write"]
fat = ["dep:hadris-fat"]
part = ["dep:hadris-part"]
iso = ["dep:hadris-iso"]
udf = ["dep:hadris-udf"]
cd = ["dep:hadris-cd"]
cpio = ["dep:hadris-cpio"]
# Detection and opening of FAT and NTFS volumes, with FAT and partitions.
block = ["dep:hadris-block", "fat", "part", "hadris-block/part"]
# Detection and opening of ISO 9660 and UDF images, with the writers.
optical = ["dep:hadris-optical", "iso", "udf", "cd", "hadris-optical/cd"]
archive = ["cpio"]
# The NTFS preview, whose native API may change in 3.x minors.
unstable-ntfs = ["dep:hadris-ntfs", "hadris-block?/unstable-ntfs"]

[dependencies]
hadris-io = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-fat = { workspace = true, optional = true, default-features = false }
hadris-part = { workspace = true, optional = true, default-features = false }
hadris-ntfs = { workspace = true, optional = true, default-features = false }
hadris-iso = { workspace = true, optional = true, default-features = false }
hadris-udf = { workspace = true, optional = true, default-features = false }
hadris-cd = { workspace = true, optional = true, default-features = false }
hadris-cpio = { workspace = true, optional = true, default-features = false }
hadris-block = { workspace = true, optional = true, default-features = false }
hadris-optical = { workspace = true, optional = true, default-features = false }
