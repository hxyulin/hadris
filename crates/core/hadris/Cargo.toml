[package]
name = "hadris"
version = "3.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
description = "A unified Rust storage toolkit for filesystems, partitions, archives, and disk images"
keywords = ["filesystem", "disk-image", "fat32", "iso9660", "no-std"]
categories = ["filesystem", "embedded", "no-std"]

[package.metadata.docs.rs]
features = ["std", "sync", "async", "write", "detect", "part", "unstable-ntfs"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync", "write", "fat", "iso", "cpio", "detect"]
std = ["alloc", "hadris-io/std", "hadris-storage/std", "hadris-fs/std", "hadris-fat?/std", "hadris-part?/std", "hadris-ntfs?/std", "hadris-iso?/std", "hadris-udf?/std", "hadris-cpio?/std"]
alloc = ["hadris-io/alloc", "hadris-storage/alloc", "hadris-fs/alloc", "hadris-fat?/alloc", "hadris-part?/alloc", "hadris-ntfs?/alloc", "hadris-iso?/alloc", "hadris-udf?/alloc", "hadris-cpio?/alloc"]
sync = ["hadris-io/sync", "hadris-storage/sync", "hadris-fs/sync", "hadris-fat?/sync", "hadris-part?/sync", "hadris-ntfs?/sync", "hadris-iso?/sync", "hadris-udf?/sync", "hadris-cpio?/sync", "hadris-fat-raw?/sync"]
async = ["hadris-io/async", "hadris-storage/async", "hadris-fs/async", "hadris-fat?/async", "hadris-part?/async", "hadris-ntfs?/async", "hadris-iso?/async", "hadris-udf?/async", "hadris-cpio?/async", "hadris-fat-raw?/async"]
# FAT formatting.
write = ["hadris-fat?/write"]
fat = ["dep:hadris-fat"]
part = ["dep:hadris-part"]
iso = ["dep:hadris-iso"]
udf = ["dep:hadris-udf"]
cpio = ["dep:hadris-cpio"]
# `detect`, `open` and `AnyFs` in `sync` and `async`, over every format
# they recognize, and `host::open`.
detect = ["fat", "iso", "udf", "cpio", "dep:hadris-fat-raw", "dep:hadris-macros"]
# The NTFS preview, whose native API may change in 3.x minors.
unstable-ntfs = ["dep:hadris-ntfs"]

[dependencies]
hadris-io = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-macros = { workspace = true, optional = true }
hadris-fat-raw = { workspace = true, optional = true, default-features = false }
hadris-fat = { workspace = true, optional = true, default-features = false }
hadris-part = { workspace = true, optional = true, default-features = false }
hadris-ntfs = { workspace = true, optional = true, default-features = false }
hadris-iso = { workspace = true, optional = true, default-features = false }
hadris-udf = { workspace = true, optional = true, default-features = false }
hadris-cpio = { workspace = true, optional = true, default-features = false }

[[test]]
name = "detect"
required-features = ["std", "sync", "write", "detect", "part"]
