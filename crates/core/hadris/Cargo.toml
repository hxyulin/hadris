[package]
name = "hadris"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
description = "A unified Rust storage toolkit for filesystems, partitions, archives, and disk images"
keywords = ["filesystem", "disk-image", "fat32", "iso9660", "no-std"]
categories = ["filesystem", "embedded", "no-std"]

[features]
default = ["std", "sync", "read", "write", "fs", "iso", "fat", "cpio"]
std = ["alloc", "hadris-fs?/std", "hadris-block?/std", "hadris-optical?/std", "hadris-cpio?/std"]
alloc = ["hadris-fs?/alloc", "hadris-block?/alloc", "hadris-optical?/alloc", "hadris-cpio?/alloc"]
read = ["hadris-block?/read", "hadris-optical?/read", "hadris-cpio?/read"]
write = ["alloc", "read", "hadris-block?/write", "hadris-optical?/write", "hadris-cpio?/write"]
sync = ["hadris-block?/sync", "hadris-optical?/sync", "hadris-cpio?/sync"]
async = ["hadris-block?/async", "hadris-optical?/async", "hadris-cpio?/async"]
block = ["storage", "fat", "part", "hadris-block/detect"]
optical = ["iso", "udf", "cd", "hadris-optical/open"]
archive = ["cpio"]
fs = ["dep:hadris-fs"]
storage = ["dep:hadris-block", "hadris-block/storage"]
fat = ["dep:hadris-block", "hadris-block/fat"]
part = ["dep:hadris-block", "hadris-block/part"]
iso = ["dep:hadris-optical", "hadris-optical/iso"]
udf = ["dep:hadris-optical", "hadris-optical/udf"]
cd = ["dep:hadris-optical", "hadris-optical/cd"]
cpio = ["dep:hadris-cpio"]

[dependencies]
hadris-fs = { workspace = true, optional = true, default-features = false }
hadris-block = { workspace = true, optional = true, default-features = false }
hadris-optical = { workspace = true, optional = true, default-features = false }
hadris-cpio = { workspace = true, optional = true, default-features = false }
