[package]
name = "hadris-io"
version = "3.0.0-rc.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "No-std I/O traits and utilities for the Hadris filesystem crates"
readme = "README.md"
keywords = ["io", "no-std", "read", "write", "seek"]
categories = ["no-std", "filesystem"]

# docs.rs builds with default features only, which would hide the modes.
[package.metadata.docs.rs]
features = ["std", "sync", "async", "embedded-io"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sync", "std"]
sync = ["dep:hadris-macros"]
async = ["dep:hadris-macros"]
alloc = ["embedded-io?/alloc", "embedded-io-async?/alloc"]
std = ["alloc", "embedded-io?/std", "embedded-io-async?/std"]
# `FromEmbedded`, the `embedded-io` traits on `StdIo`, and conversions
# between `SeekFrom` and `embedded_io::SeekFrom`.
embedded-io = ["dep:embedded-io", "dep:embedded-io-async"]

[dependencies]
hadris-macros = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
