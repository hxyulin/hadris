[package]
name = "hadris-common"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal types and functions shared by the Hadris crates; not for direct use"
readme = "README.md"
keywords = ["filesystem", "endian", "iso-string"]
categories = ["no-std", "filesystem"]
include = ["src/**/*", "Cargo.toml"]

[features]
default = ["bytemuck", "std"]
sync = ["hadris-io/sync"]
async = ["hadris-io/async"]
alloc = ["hadris-io/alloc", "hadris-fs/alloc"]
std = ["alloc", "hadris-io/std"]
bytemuck = ["dep:bytemuck"]

[dependencies]
bytemuck = { workspace = true, optional = true, features = ["derive"] }
zerocopy = { workspace = true }
heapless = "0.9.3"
hadris-io = { workspace = true }
hadris-fs = { workspace = true }

[dev-dependencies]
criterion.workspace = true
static_assertions.workspace = true
