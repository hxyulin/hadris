[package]
name = "hadris-fs"
version = "3.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared filesystem vocabulary and the FileSystem trait for the Hadris crates: names, times, metadata, errors, volumes and handles"
readme = "README.md"
keywords = ["filesystem", "no-std", "path", "metadata"]
categories = ["no-std", "filesystem"]
include = ["src/**/*", "Cargo.toml", "README.md"]

# docs.rs builds with default features only, which would hide the modes.
[package.metadata.docs.rs]
features = ["std", "sync", "async", "contract"]

[features]
default = []
alloc = ["hadris-io/alloc", "hadris-storage/alloc", "dep:async-lock", "dep:spin"]
std = ["alloc", "hadris-io/std", "hadris-storage/std", "async-lock?/std", "dep:libc"]
sync = ["hadris-io/sync", "dep:hadris-macros"]
async = ["hadris-io/async", "dep:hadris-macros"]
# The driver contract kit: `contract::check` in each enabled mode.
contract = []

[dependencies]
bitflags = { workspace = true }
hadris-io = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true, optional = true }
async-lock = { version = "3", default-features = false, optional = true }

# `spin` guards the queue of calls dropped handles leave for a `Volume`, which
# needs atomic compare-and-swap like the `Arc` it lives in.
[target.'cfg(target_has_atomic = "ptr")'.dependencies]
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"], optional = true }

# `host::local_utc_offset` reads the host's zone with `localtime_r`.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
hadris-macros = { workspace = true }
