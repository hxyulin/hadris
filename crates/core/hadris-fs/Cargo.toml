[package]
name = "hadris-fs"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared filesystem vocabulary for the Hadris crates: names, times, metadata, errors and virtual paths"
readme = "README.md"
keywords = ["filesystem", "no-std", "path", "metadata"]
categories = ["no-std", "filesystem"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[features]
default = []
alloc = ["hadris-io/alloc", "hadris-storage/alloc", "dep:async-lock"]
std = ["alloc", "hadris-io/std", "hadris-storage/std", "async-lock?/std"]
sync = ["hadris-io/sync", "dep:spin", "dep:hadris-macros"]
async = ["hadris-io/async", "dep:spin"]
async-send = ["async", "hadris-io/async-send", "dep:hadris-macros"]
embassy-sync = ["async", "dep:embassy-sync"]

[dependencies]
bitflags = { workspace = true }
hadris-io = { workspace = true, default-features = false }
hadris-storage = { workspace = true, default-features = false }
hadris-macros = { workspace = true, optional = true }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"], optional = true }
async-lock = { version = "3", default-features = false, optional = true }
embassy-sync = { version = "0.8", optional = true }

[dev-dependencies]
hadris-macros = { workspace = true }
