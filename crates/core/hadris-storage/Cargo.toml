[package]
name = "hadris-storage"
version = "3.0.0-rc.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust block-device geometry, capabilities, and adapters for std and no-std storage"
readme = "README.md"
keywords = ["block-device", "storage", "sector", "embedded", "no-std"]
categories = ["no-std", "filesystem"]

# docs.rs builds with default features only, which would hide the modes.
[package.metadata.docs.rs]
features = ["std", "sync", "async"]

[features]
default = ["std", "sync"]
alloc = ["hadris-io/alloc"]
std = ["alloc", "hadris-io/std", "dep:libc"]
sync = ["hadris-io/sync"]
async = ["hadris-io/async"]

[dependencies]
hadris-io = { workspace = true }
hadris-macros.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[[example]]
name = "aligned_device"
required-features = ["sync"]

[dev-dependencies]
static_assertions.workspace = true
