[package]
name = "hadris-cpio"
autotests = false
version = "3.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust cpio archives (newc, crc, odc, old binary) with an allocation-free streaming reader and a writer for Linux initramfs"
keywords = ["cpio", "archive", "initramfs", "linux", "no-std"]
categories = ["filesystem", "encoding", "no-std"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["std", "sync", "async"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "sync"]
# The writer and the `Tree` input.
alloc = ["hadris-io/alloc", "hadris-fs/alloc"]
# Implies `alloc`; `std::io::Error` conversions and host files as tree content.
std = ["alloc", "hadris-io/std", "hadris-fs/std"]
sync = ["hadris-io/sync", "hadris-fs/sync"]
async = ["hadris-io/async", "hadris-fs/async"]

[dependencies]
hadris-io = { workspace = true, default-features = false }
hadris-fs = { workspace = true, default-features = false }
hadris-macros = { workspace = true }

[dev-dependencies]
hadris-fs = { workspace = true, features = ["std", "sync"] }
hadris-io = { workspace = true, features = ["std", "sync"] }
tempfile.workspace = true

[[test]]
name = "roundtrip"
required-features = ["std", "sync"]

[[test]]
name = "async_writer"
required-features = ["std", "sync"]
