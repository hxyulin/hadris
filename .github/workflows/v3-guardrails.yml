name: V3 guardrails

# Stability rule checks from docs/v3-api-design.md (R1, R11, R12). A finding
# fails the job. Until a crate's version is released, scripts/check-semver.sh
# only reports breaks against its previous pre-release as warnings; it
# documents the semver baselines.

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'examples/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/check-semver.sh'
      - 'scripts/test-check-semver.py'
      - 'scripts/check-non-exhaustive.py'
      - '.github/workflows/v3-guardrails.yml'
      - '!**/README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'examples/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/check-semver.sh'
      - 'scripts/test-check-semver.py'
      - 'scripts/check-non-exhaustive.py'
      - '.github/workflows/v3-guardrails.yml'
      - '!**/README.md'

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # cargo-semver-checks needs a newer toolchain than the pinned 1.88.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Test semver baseline selection
        run: python3 scripts/test-check-semver.py
      - name: Install cargo-semver-checks
        run: cargo +stable install cargo-semver-checks --locked
      - name: Check semver against the latest release or the target branch
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: scripts/check-semver.sh "$BASE_REF"

  non-exhaustive:
    name: non_exhaustive lint (R1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Self-test lint
        run: python3 scripts/check-non-exhaustive.py --self-test
      - name: Check public enums, structs and raw re-exports (R1, R12)
        run: python3 scripts/check-non-exhaustive.py
