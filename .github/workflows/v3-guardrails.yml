name: V3 guardrails

# Stability rule checks from docs/v3-api-design.md (R11). Every check blocks
# since 3.0.0-rc.1. scripts/check-semver.sh documents the semver baselines.

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'examples/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/check-semver.sh'
      - 'scripts/test-check-semver.py'
      - 'scripts/check-non-exhaustive.py'
      - '.github/workflows/v3-guardrails.yml'
      - '!**/README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'examples/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/check-semver.sh'
      - 'scripts/test-check-semver.py'
      - 'scripts/check-non-exhaustive.py'
      - '.github/workflows/v3-guardrails.yml'
      - '!**/README.md'

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # cargo-semver-checks needs a newer toolchain than the pinned 1.88.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Test semver baseline selection
        run: python3 scripts/test-check-semver.py
      - name: Install cargo-semver-checks
        run: cargo +stable install cargo-semver-checks --locked
      - name: Check semver against the latest release or the target branch
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: scripts/check-semver.sh "$BASE_REF"

  non-exhaustive:
    name: non_exhaustive lint (R1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test lint
        run: python3 scripts/check-non-exhaustive.py --self-test
      - name: Check public enums and structs
        run: python3 scripts/check-non-exhaustive.py
