name: Documentation

on:
  push:
    branches: [main, next]
    paths:
      - "README.md"
      - "crates/**"
      - "scripts/check-docs.py"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "crates/**/README.md"
      - "scripts/check-docs.py"
      - "website/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-test documentation checker
        run: python3 scripts/check-docs.py --self-test
      - name: Check documentation links and package READMEs
        run: python3 scripts/check-docs.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Generate released versions
        working-directory: website
        run: npm run versions
      - name: Build documentation
        working-directory: website
        run: npm run build

  # One build serves every version: the newest released minor at the root,
  # older released minors under X.Y/ (generated from the release tags) and
  # the docs of the site branch under next/. The site branch is `next` while
  # it exists and `main` otherwise, so pushes to either branch and releases
  # rebuild the same site. Set the repository variable DOCS_DOMAIN (for
  # example docs.example.org) after configuring that custom domain for Pages.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HADRIS_SITE_URL: ${{ vars.DOCS_DOMAIN && format('https://{0}', vars.DOCS_DOMAIN) || 'https://hxyulin.github.io' }}
      HADRIS_BASE_URL: ${{ vars.DOCS_DOMAIN && '/' || '/hadris/' }}
    steps:
      - name: Select the site branch
        id: branch
        run: |
          if git ls-remote --exit-code --heads "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" next > /dev/null; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Check documentation links and package READMEs
        run: python3 scripts/check-docs.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the site
        working-directory: website
        env:
          HADRIS_DOCS_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          npm ci
          npm run versions
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the API docs
        env:
          RUSTDOCFLAGS: --cfg docsrs
          RUSTC_BOOTSTRAP: "1"
        run: cargo doc --workspace --no-deps --all-features
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R website/build/. site/
          mkdir -p site/next
          cp -R target/doc site/next/api
          if [ -n "${{ vars.DOCS_DOMAIN }}" ]; then echo "${{ vars.DOCS_DOMAIN }}" > site/CNAME; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
