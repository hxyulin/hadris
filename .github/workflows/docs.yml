name: Documentation

on:
  push:
    branches: [main, next]
    paths:
      - "README.md"
      - "crates/**"
      - "scripts/check-docs.py"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "crates/**/README.md"
      - "scripts/check-docs.py"
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test documentation checker
        run: python3 scripts/check-docs.py --self-test
      - name: Check documentation links and package READMEs
        run: python3 scripts/check-docs.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build documentation
        working-directory: website
        run: npm run build

  # The site holds the released docs from `main` at the root and the
  # unreleased docs from `next` under `next/`, so a push to either branch
  # rebuilds both. Set the repository variable DOCS_DOMAIN (for example
  # docs.example.org) after configuring that custom domain for Pages.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HADRIS_SITE_URL: ${{ vars.DOCS_DOMAIN && format('https://{0}', vars.DOCS_DOMAIN) || 'https://hxyulin.github.io' }}
      ROOT_BASE: ${{ vars.DOCS_DOMAIN && '/' || '/hadris/' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: next
          path: next
      - name: Check documentation links and package READMEs
        run: |
          (cd main && python3 scripts/check-docs.py)
          (cd next && python3 scripts/check-docs.py)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the released site
        working-directory: main/website
        env:
          HADRIS_BASE_URL: ${{ env.ROOT_BASE }}
          HADRIS_DOCS_CHANNEL: stable
        run: |
          npm ci
          npm run build
      - name: Build the next site
        working-directory: next/website
        env:
          HADRIS_BASE_URL: ${{ env.ROOT_BASE }}next/
          HADRIS_DOCS_CHANNEL: next
          HADRIS_STABLE_URL: ${{ env.HADRIS_SITE_URL }}${{ env.ROOT_BASE }}
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next
      - name: Build the next API docs
        working-directory: next
        env:
          RUSTDOCFLAGS: --cfg docsrs
          RUSTC_BOOTSTRAP: "1"
        run: cargo doc --workspace --no-deps --all-features
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R main/website/build/. site/
          mkdir -p site/next
          cp -R next/website/build/. site/next/
          cp -R next/target/doc site/next/api
          if [ -n "${{ vars.DOCS_DOMAIN }}" ]; then echo "${{ vars.DOCS_DOMAIN }}" > site/CNAME; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
