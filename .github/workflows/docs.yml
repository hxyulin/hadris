name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/hadris-3.0.0-migration.md"
      - "examples/README.md"
      - "crates/**"
      - "scripts/check-docs.py"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/hadris-3.0.0-migration.md"
      - "examples/README.md"
      - "crates/**/README.md"
      - "scripts/check-docs.py"
      - "website/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild documentation from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-test documentation checker
        run: python3 scripts/check-docs.py --self-test
      - name: Check documentation links, TOML recipes and package READMEs
        run: python3 scripts/check-docs.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Generate released versions
        working-directory: website
        run: npm run versions
      - name: Build documentation
        working-directory: website
        run: npm run build

  # One build serves current V3 docs at the root, release snapshots under
  # X.Y/ and redirects from next/. Source API docs remain under next/api/.
  # Set DOCS_DOMAIN (for
  # example docs.example.org) after configuring that custom domain for Pages.
  build:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      HADRIS_SITE_URL: ${{ vars.DOCS_DOMAIN && format('https://{0}', vars.DOCS_DOMAIN) || 'https://hxyulin.github.io' }}
      HADRIS_BASE_URL: ${{ vars.DOCS_DOMAIN && '/' || '/hadris/' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Check documentation links, TOML recipes and package READMEs
        run: python3 scripts/check-docs.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the site
        working-directory: website
        env:
          HADRIS_DOCS_BRANCH: main
        run: |
          npm ci
          npm run versions
          npm run build
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - name: Build the API docs
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
          RUSTDOCFLAGS: --cfg docsrs
          RUSTC_BOOTSTRAP: "1"
        run: cargo doc --workspace --no-deps --all-features
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R website/build/. site/
          mkdir -p site/next
          cp -R target/doc site/next/api
          if [ -n "${{ vars.DOCS_DOMAIN }}" ]; then echo "${{ vars.DOCS_DOMAIN }}" > site/CNAME; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
