name: Rust CI

on:
  push:
    branches: [main, dev, v2-dev]
  pull_request:
    branches: [main, v2-dev]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace at the MSRV
        run: |
          cargo check --workspace --locked
          cargo check --workspace --all-features --locked

  check-features:
    name: MSRV features (${{ matrix.group }})
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        group: [core, block, optical, archive, facades]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.group }}
      - name: Check each feature tier independently
        run: python3 scripts/check-features.py ${{ matrix.group }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tests/Cargo.toml --all -- --check
      - name: Check specification annotations
        run: |
          python3 scripts/check-spec-annotations.py --self-test
          python3 scripts/check-spec-annotations.py
          python3 scripts/check-compliance-catalog.py --self-test
          python3 scripts/check-compliance-catalog.py
      - name: Check dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: 1.97.1
          command: check
          command-arguments: licenses

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests -> target
      # Defer new style-only rewrites during the CI toolchain migration.
      - name: Lint workspace and conformance suite
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- \
            -D warnings -A clippy::manual_is_multiple_of -A clippy::collapsible_if \
            -A clippy::unnecessary_sort_by -A clippy::byte_char_slices
          cargo clippy --manifest-path tests/Cargo.toml --all-targets --locked -- \
            -D warnings -A clippy::manual_is_multiple_of -A clippy::collapsible_if \
            -A clippy::unnecessary_sort_by -A clippy::byte_char_slices
      - name: Check documentation and examples
        run: |
          cargo doc --workspace --no-deps --all-features --locked
          cargo test --workspace --all-features --doc --locked
          cargo check --workspace --all-features --examples --locked

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests -> target
      - name: Install interoperability tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools exfatprogs xorriso udftools p7zip-full libarchive-tools
      - name: Run all-feature tests
        if: runner.os != 'Windows'
        env:
          HADRIS_REQUIRE_EXTERNAL_TOOLS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --workspace --all-features --tests --locked
      # defmt runtime symbols cannot be linked into hosted Windows tests.
      - name: Run portable hosted tests
        if: runner.os == 'Windows'
        run: |
          cargo test --workspace --all-features --tests --locked --exclude hadris-fat
          cargo test -p hadris-fat --features "std,alloc,sync,async,read,write,lfn,cache,tool,unstable-exfat,dirty-file-panic" --tests --locked
      - name: Run conformance and interoperability suite
        if: runner.os == 'Linux'
        env:
          HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
        run: cargo test --manifest-path tests/Cargo.toml --locked -- --nocapture

  public-api:
    name: Public API snapshots
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly-2026-09-04
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Check all-feature public API snapshots
        run: scripts/check-public-api.sh

  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --component miri --profile minimal
      - name: Setup Miri
        run: cargo +nightly miri setup
      - uses: Swatinem/rust-cache@v2
      - name: Check FixedFilename safety
        run: cargo +nightly miri test -p hadris-common --lib
      - name: Check LFN decoding
        run: cargo +nightly miri test -p hadris-fat --lib file::lfn_unicode_tests
      - name: Check LFN encoding
        run: cargo +nightly miri test -p hadris-fat --lib lfn_write_safety_tests
      - name: Check ISO string safety
        run: cargo +nightly miri test -p hadris-iso --lib types::iso_str_safety_tests
