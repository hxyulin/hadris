name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege GITHUB_TOKEN. Without an explicit block the token inherits the
# repo/org default (often write), which CodeQL flags as
# `actions/missing-workflow-permissions` — a compromised step could otherwise
# push code, create releases, or modify settings. This workflow only needs to
# check out the tree.
permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  changes:
    name: CI scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      suite: ${{ steps.scope.outputs.suite }}
      native: ${{ steps.scope.outputs.native }}
      spec: ${{ steps.scope.outputs.spec }}
      licenses: ${{ steps.scope.outputs.licenses }}
      formatting: ${{ steps.scope.outputs.formatting }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: scope
        with:
          base: ${{ github.ref_name }}
          predicate-quantifier: some-with-excludes
          filters: |
            formatting:
              - '{rustfmt,.rustfmt}.toml'
            rust:
              - 'crates/**'
              - 'examples/**'
              - '.cargo/**'
              - 'Cargo.{toml,lock}'
              - 'rust-toolchain.toml'
              - 'scripts/{ci-features.json,check-features.py,check-targets.sh,firmware-size.py}'
              - '.github/workflows/rust.yml'
              - '!**/README.md'
            suite:
              - 'tests/**'
              - '!tests/README.md'
            native:
              - 'flake.{nix,lock}'
              - '.envrc'
              - 'scripts/{build-fatfs-peer.py,test-fatfs-peer.py,test-ntfs.sh}'
            spec:
              - 'spec/**'
              - 'docs/compliance/**'
              - 'docs/spec-coverage.md'
              - 'scripts/{check-spec-annotations.py,check-compliance-catalog.py}'
            licenses:
              - '**/Cargo.{toml,lock}'
              - 'deny.toml'
              - 'LICENSE*'
              - '.github/workflows/rust.yml'

  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check
          command-arguments: licenses

  # Enforce annotation grammar, evidence references, and coverage-table parity.
  # See docs/spec-coverage.md#annotation-convention.
  spec-annotations:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.suite == 'true' || needs.changes.outputs.spec == 'true'
    name: Spec annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test checker
        run: python3 scripts/check-spec-annotations.py --self-test
      - name: Check @hadris-* tags
        run: python3 scripts/check-spec-annotations.py
      - name: Self-test compliance catalog checker
        run: python3 scripts/check-compliance-catalog.py --self-test
      - name: Check compliance catalogs
        run: python3 scripts/check-compliance-catalog.py

  check:
    needs: changes
    if: always() && !cancelled()
    name: Check
    runs-on: ubuntu-latest
    # Promote rustc warnings to errors so issues like `unconditional_recursion`
    # (see issue #23) fail CI instead of slipping through.
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - name: Check workspace (default features)
        if: needs.changes.outputs.rust == 'true'
        run: cargo check --workspace

  default-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Test default features
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace with default features
        run: cargo test --workspace --locked

  check-features:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: "MSRV features (${{ matrix.group }})"
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        group: [core, block, optical, archive, facades]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.group }}
      - name: Check each feature tier independently
        run: python3 scripts/check-features.py ${{ matrix.group }}

  cross:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: "Build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        # NF-TARGET-01: thumbv6m and riscv32imc have no compare-and-swap,
        # so they build the tiers without an allocator only.
        target:
          - thumbv6m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the no_std tiers
        run: scripts/check-targets.sh ${{ matrix.target }}

  firmware-size:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Embedded flash and stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # -Z emit-stack-sizes needs the pinned nightly.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-09-04
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf, riscv32imc-unknown-none-elf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: firmware
      - name: Measure the embedded API (NF-STACK-01, NF-STACK-02, NF-FLASH-01)
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-04
        run: python3 scripts/firmware-size.py --check

  test:
    needs: changes
    if: always() && !cancelled()
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ needs.changes.outputs.rust == 'true' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - name: Attach a loop device for the disk size tests
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          truncate -s 4M "$RUNNER_TEMP/disk.img"
          dev=$(sudo losetup --find --show --sector-size 4096 "$RUNNER_TEMP/disk.img")
          sudo chmod a+r "$dev"
          {
            echo "HADRIS_TEST_DISK=$dev"
            echo "HADRIS_TEST_DISK_LEN=4194304"
            echo "HADRIS_TEST_DISK_BLOCK_SIZE=4096"
            echo "HADRIS_REQUIRE_TEST_DISK=1"
          } >> "$GITHUB_ENV"
      - name: Run all-feature tests
        if: needs.changes.outputs.rust == 'true' && runner.os != 'Windows'
        run: cargo test --workspace --all-features --tests
      # `hadris-fat/defmt` is an embedded logging integration. It can be
      # type-checked on every host, but its runtime symbols are supplied by an
      # embedded target and therefore cannot be linked into Windows test
      # executables. The feature matrix above still checks the complete feature
      # combination; Windows exercises the portable hosted defaults here.
      - name: Run portable hosted tests
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Windows'
        run: |
          cargo test --workspace --all-features --tests --exclude hadris-fat --exclude hadris-fat-raw
          cargo test -p hadris-fat --features "std,alloc,sync,async,write,tracing" --tests
          cargo test -p hadris-fat-raw --features "sync,async" --tests
      - name: Run FAT future-size budgets without tracing
        if: needs.changes.outputs.rust == 'true'
        run: cargo test -p hadris-fat --features async --test fatfs_async --test embedded --test embedded_exfat stay_small
      - name: Run FAT performance harness smoke check
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: cargo bench -p hadris-fat --bench performance -- --smoke
      - name: Run CPIO performance harness smoke check
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: cargo bench -p hadris-cpio --bench performance -- --smoke
      # Each use-case example builds its own images, checks them and exits
      # non-zero on any mismatch; see examples/README.md.
      - name: Run the use-case examples
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          cargo run --quiet -p hadris-storage --no-default-features --features sync --example aligned_device
          for example in apfs-inspect boot-media extract image-edit initramfs inspect migrate-v3 sd-logger vfs-driver; do
            cargo run --quiet -p "hadris-example-$example"
          done
          for bin in fat fat-log fat-unicode fat-async exfat; do
            cargo run --quiet -p hadris-example-firmware --bin "$bin"
          done

  # A disk device node reports no size through its metadata, so
  # `hadris_storage::file_len` asks the OS. These jobs attach a real device
  # where the platform needs its own request.
  test-device-freebsd:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Test disk device size (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Measure an md device in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          run: |
            set -e
            . "$HOME/.cargo/env"
            truncate -s 4M /tmp/disk.img
            dev=/dev/$(mdconfig -a -t vnode -S 4096 -f /tmp/disk.img)
            export RUSTUP_TOOLCHAIN=1.97.1 HADRIS_REQUIRE_TEST_DISK=1
            export HADRIS_TEST_DISK="$dev" HADRIS_TEST_DISK_LEN=4194304 HADRIS_TEST_DISK_BLOCK_SIZE=4096
            cargo test -p hadris-storage --lib device_tests
            cargo test -p hadris-fs --features std,sync --test tree content_path

  test-device-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Test disk device size (Windows)
    runs-on: windows-latest
    env:
      HADRIS_REQUIRE_TEST_DISK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Attach a VHD
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP "disk.vhd"
          $script = Join-Path $env:RUNNER_TEMP "attach.txt"
          "create vdisk file=`"$vhd`" maximum=4 type=fixed`r`nattach vdisk" | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $disk = Get-DiskImage -ImagePath $vhd | Get-Disk
          "HADRIS_TEST_DISK=\\.\PhysicalDrive$($disk.Number)" >> $env:GITHUB_ENV
          "HADRIS_TEST_DISK_LEN=$($disk.Size)" >> $env:GITHUB_ENV
          "HADRIS_TEST_DISK_BLOCK_SIZE=$($disk.LogicalSectorSize)" >> $env:GITHUB_ENV
      - name: Measure the VHD as a block device
        run: cargo test -p hadris-storage --lib device_tests
      - name: Read the VHD as tree content
        run: cargo test -p hadris-fs --features std,sync --test tree content_path

  test-exfat:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.suite == 'true' || needs.changes.outputs.native == 'true'
    name: Test exFAT (with external tools)
    runs-on: ubuntu-latest
    env:
      HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests -> target
      - name: Install exfatprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs
      - name: Run exFAT tests against fsck.exfat and mkfs.exfat
        run: |
          cargo test -p hadris-fat --features "std,sync,async,write" \
            --test exfat_read --test exfat_write --test exfat_format --test exfat_check \
            --test exfat_contract --test exfat_native --test exfat_async -- --nocapture
      - name: Run exFAT conformance and interoperability tests
        run: "cargo test --manifest-path tests/Cargo.toml exfat:: -- --nocapture"

  test-ntfs:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.suite == 'true' || needs.changes.outputs.native == 'true'
    name: Test NTFS (with ntfsprogs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install ntfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g
      # Tests that populate a volume through an ntfs-3g FUSE mount skip
      # without FUSE permissions; scripts/test-ntfs.sh runs them all.
      - name: Run NTFS tests against mkntfs volumes
        run: cargo test -p hadris-ntfs --all-features -- --nocapture

  test-fat-conformance:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.suite == 'true' || needs.changes.outputs.native == 'true'
    name: Test FAT conformance and interoperability
    runs-on: ubuntu-latest
    env:
      HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests -> target
      - name: Install FAT image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools time
      - name: Run test harness unit tests
        run: "cargo test --manifest-path tests/Cargo.toml --lib"
      - name: Run V3 performance harness smoke check
        env:
          HADRIS_TESTS_PERF_SAMPLES: "1"
        run: |
          cargo bench --manifest-path tests/Cargo.toml --bench performance
          HADRIS_TESTS_PERF_BACKEND=file HADRIS_TESTS_REPORT_DIR=tests/target/reports/resources \
            cargo bench --manifest-path tests/Cargo.toml --bench performance
      - name: Cache pinned ChaN FatFs sources
        uses: actions/cache@v4
        with:
          path: |
            tests/target/chan-fatfs/ff16.zip
            tests/target/chan-fatfs/ff16p1.diff
            tests/target/chan-fatfs/ff16p2.diff
          key: chan-fatfs-${{ hashFiles('scripts/build-fatfs-peer.py') }}
      - name: Build pinned ChaN FatFs peer
        run: python3 scripts/build-fatfs-peer.py
      - name: Test ChaN FatFs helper
        run: python3 scripts/test-fatfs-peer.py tests/target/chan-fatfs/chan-fatfs
      - name: Run FAT peer performance smoke check
        env:
          HADRIS_TESTS_PERF_SAMPLES: "1"
          HADRIS_TESTS_PERF_FILTER: "fat"
          HADRIS_TESTS_CHAN_FATFS: "${{ github.workspace }}/tests/target/chan-fatfs/chan-fatfs"
        run: cargo bench --manifest-path tests/Cargo.toml --bench peers
      - name: Run cached FAT32 profile smoke check
        env:
          HADRIS_TESTS_PERF_FILES: "1000"
          HADRIS_TESTS_PROFILE_WORKLOAD: lookup-all
          HADRIS_TESTS_PROFILE_SECONDS: "1"
          HADRIS_TESTS_PROFILE_CACHE: "1"
        run: |
          cargo bench --manifest-path tests/Cargo.toml --bench peers > profile-smoke.log 2>&1 || {
            cat profile-smoke.log
            exit 1
          }
      - name: Run FAT conformance and interoperability tests
        run: "cargo test --manifest-path tests/Cargo.toml fat:: -- --skip exfat:: --nocapture"

  test-optical:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.suite == 'true' || needs.changes.outputs.native == 'true'
    name: Test optical interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests -> target
      - name: Install optical image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso genisoimage udftools p7zip-full libarchive-tools
      - name: Run ISO peer performance smoke check
        env:
          HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
          HADRIS_TESTS_PERF_SAMPLES: "1"
          HADRIS_TESTS_PERF_FILTER: "iso"
        run: cargo bench --manifest-path tests/Cargo.toml --bench peers
      - name: Run ISO conformance and interoperability tests
        env:
          HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
        run: "cargo test --manifest-path tests/Cargo.toml iso:: -- --nocapture"
      - name: Run UDF interoperability tests
        env:
          HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
        run: cargo test -p hadris-udf --all-features --test interop -- --nocapture
      - name: Qualify hybrid ISO/UDF images
        run: cargo test -p hadris-udf --all-features --test bridge -- --nocapture

  # CLI tests live in crates/tools/hadris-cli/tests
  # and run under the workspace `test` job.

  doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc --workspace --all-features
        run: cargo doc --workspace --no-deps --all-features
      - name: Compile rustdoc examples
        run: cargo test --workspace --all-features --doc
      - name: Compile Cargo example targets
        run: cargo check --workspace --all-features --examples

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.suite == 'true' || needs.changes.outputs.formatting == 'true'
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check conformance suite formatting
        run: cargo fmt --manifest-path tests/Cargo.toml --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.suite == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests -> target
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::manual_is_multiple_of -A clippy::collapsible_if -A clippy::unnecessary_sort_by -A clippy::byte_char_slices
      - name: Run clippy on conformance suite
        run: cargo clippy --manifest-path tests/Cargo.toml --all-targets -- -D warnings -A clippy::manual_is_multiple_of -A clippy::collapsible_if -A clippy::unnecessary_sort_by -A clippy::byte_char_slices

  miri:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    # Miri runs Rust through an interpreter to catch undefined behavior at
    # runtime. We only point it at focused unit tests that exercise
    # historically-unsafe code paths (see issues #26 and #28). Miri is too slow
    # — and too restricted (no real I/O) — to run the full test suite, but
    # these targeted tests catch regressions cheaply.
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain with miri
        run: |
          rustup toolchain install nightly --component miri
          rustup +nightly component add miri
      - name: Setup miri
        run: cargo +nightly miri setup
      - uses: Swatinem/rust-cache@v2
      - name: Miri — hadris-common (FixedFilename safety)
        run: cargo +nightly miri test -p hadris-common --lib
      - name: Miri - hadris-fat-raw (LFN UTF-16, surrogate pairs and name decoding)
        run: cargo +nightly miri test -p hadris-fat-raw --lib
      - name: Miri - hadris-iso (on-disk layouts, name and Rock Ridge decoding)
        run: |
          cargo +nightly miri test -p hadris-iso-raw --lib
          cargo +nightly miri test -p hadris-iso --lib -- name:: rock_ridge::
      - name: Miri file device geometry and aligned adapter
        run: |
          MIRIFLAGS="-Zmiri-disable-isolation" cargo +nightly miri test -p hadris-storage --lib file_device_explicit_block_size
          cargo +nightly miri test -p hadris-storage --no-default-features --features sync --example aligned_device
      - name: Miri - hadris-part (on-disk layouts, CRC, UTF-16 partition names)
        run: cargo +nightly miri test -p hadris-part --lib
      - name: Miri - hadris-apfs (layouts and record decoding)
        run: |
          cargo +nightly miri test -p hadris-apfs --lib
