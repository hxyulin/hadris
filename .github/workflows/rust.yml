name: Rust CI

on:
  push:
    branches:
      - main
      - next
      - dev
      - v2-dev
  pull_request:
    branches:
      - main
      - next
      - v2-dev

# Least-privilege GITHUB_TOKEN. Without an explicit block the token inherits the
# repo/org default (often write), which CodeQL flags as
# `actions/missing-workflow-permissions` — a compromised step could otherwise
# push code, create releases, or modify settings. This workflow only needs to
# check out the tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88.0"
          command: check
          command-arguments: licenses

  # Enforce annotation grammar, evidence references, and coverage-table parity.
  # See docs/spec-coverage.md#annotation-convention.
  spec-annotations:
    name: Spec annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test checker
        run: python3 scripts/check-spec-annotations.py --self-test
      - name: Check @hadris-* tags
        run: python3 scripts/check-spec-annotations.py
      - name: Self-test compliance catalog checker
        run: python3 scripts/check-compliance-catalog.py --self-test
      - name: Check compliance catalogs
        run: python3 scripts/check-compliance-catalog.py

  public-api:
    name: Public API snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      # cargo-public-api generates rustdoc JSON through nightly rustdoc even
      # though the project itself remains pinned to the stable MSRV above.
      # Pin the nightly: rustdoc's rendering of blanket impls (e.g.
      # `std::io::Read` vs `alloc::io::read::Read`) drifts between nightlies, so
      # an unpinned toolchain makes the snapshot diff nondeterministic. Bump
      # this date deliberately alongside a snapshot refresh.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-04
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Check all-feature public API snapshots
        # cargo-public-api 0.52.0 has no --toolchain flag but honors
        # RUSTUP_TOOLCHAIN when it names a nightly, so this drives rustdoc with
        # the pinned dated nightly installed above.
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-04
        run: scripts/check-public-api.sh

  check:
    name: Check
    runs-on: ubuntu-latest
    # Promote rustc warnings to errors so issues like `unconditional_recursion`
    # (see issue #23) fail CI instead of slipping through.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace (default features)
        run: cargo check --workspace

  check-features:
    name: "Check ${{ matrix.crate }} (${{ matrix.tier }})"
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          # hadris-fs
          - crate: hadris-fs
            tier: no-std
            features: ""
          - crate: hadris-fs
            tier: alloc
            features: "alloc"
          - crate: hadris-fs
            tier: std
            features: "std"
          - crate: hadris-fs
            tier: no-std-sync
            features: "sync"
          - crate: hadris-fs
            tier: std-sync-host-helpers
            features: "std,sync"
          - crate: hadris-fs
            tier: no-std-async
            features: "async"
          - crate: hadris-fs
            tier: embassy
            features: "embassy-sync"
          - crate: hadris-fs
            tier: all-modes
            features: "alloc,sync,async,async-send"

          # hadris-io
          - crate: hadris-io
            tier: no-std
            features: ""
          - crate: hadris-io
            tier: std
            features: "std"
          - crate: hadris-io
            tier: async
            features: "async,alloc"
          - crate: hadris-io
            tier: async-send
            features: "async-send"

          # hadris-common
          - crate: hadris-common
            tier: no-std
            features: ""
          - crate: hadris-common
            tier: bytemuck
            features: "bytemuck"

          # hadris-storage
          - crate: hadris-storage
            tier: no-std-sync
            features: "sync"
          - crate: hadris-storage
            tier: no-std-async
            features: "async"
          - crate: hadris-storage
            tier: sync-and-async
            features: "alloc,sync,async"
          - crate: hadris-storage
            tier: async-send
            features: "alloc,async-send"

          # hadris-part
          - crate: hadris-part
            tier: no-std-sync
            features: "sync"
          - crate: hadris-part
            tier: no-std-async
            features: "async"
          - crate: hadris-part
            tier: no-std-async-send
            features: "async-send"
          - crate: hadris-part
            tier: tables-only
            features: "alloc"
          - crate: hadris-part
            tier: alloc-sync
            features: "alloc,sync"
          - crate: hadris-part
            tier: alloc-async-send
            features: "alloc,async-send"
          - crate: hadris-part
            tier: std
            features: "std,sync"
          - crate: hadris-part
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send"

          # hadris-fat
          - crate: hadris-fat
            tier: no-std
            features: "sync"
          - crate: hadris-fat
            tier: no-std-async
            features: "async"
          - crate: hadris-fat
            tier: fatfs-no-alloc-sync
            features: "sync,write"
          - crate: hadris-fat
            tier: fatfs-no-alloc-async
            features: "async-send,write"
          - crate: hadris-fat
            tier: exfat-no-alloc
            features: "async-send,write,unstable-exfat"
          - crate: hadris-fat
            tier: alloc
            features: "alloc,sync,unstable-exfat"
          - crate: hadris-fat
            tier: std
            features: "std,sync,write,unstable-exfat"
          - crate: hadris-fat
            tier: hosted-async-write
            features: "std,async,write"
          - crate: hadris-fat
            tier: sync-and-async-write
            features: "alloc,sync,async,write,unstable-exfat"
          - crate: hadris-fat
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send,write,unstable-exfat,defmt"

          # hadris-iso
          - crate: hadris-iso
            tier: no-std-sync
            features: "sync"
          - crate: hadris-iso
            tier: no-std-async
            features: "async"
          - crate: hadris-iso
            tier: no-std-async-send
            features: "async-send"
          - crate: hadris-iso
            tier: alloc-sync
            features: "alloc,sync"
          - crate: hadris-iso
            tier: alloc-async-send
            features: "alloc,async-send"
          - crate: hadris-iso
            tier: std
            features: "std,sync"
          - crate: hadris-iso
            tier: hosted-async
            features: "std,async"
          - crate: hadris-iso
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send"

          # hadris-udf
          - crate: hadris-udf
            tier: no-std-sync
            features: "sync"
          - crate: hadris-udf
            tier: no-std-async
            features: "async"
          - crate: hadris-udf
            tier: no-std-async-send
            features: "async-send"
          - crate: hadris-udf
            tier: alloc-sync
            features: "alloc,sync"
          - crate: hadris-udf
            tier: alloc-async-send
            features: "alloc,async-send"
          - crate: hadris-udf
            tier: std
            features: "std,sync"
          - crate: hadris-udf
            tier: hosted-async
            features: "std,async"
          - crate: hadris-udf
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send"

          # hadris-cpio
          - crate: hadris-cpio
            tier: no-std-sync-reader
            features: "sync"
          - crate: hadris-cpio
            tier: no-std-async-reader
            features: "async"
          - crate: hadris-cpio
            tier: no-std-async-send-reader
            features: "async-send"
          - crate: hadris-cpio
            tier: alloc-sync
            features: "alloc,sync"
          - crate: hadris-cpio
            tier: alloc-async-send
            features: "alloc,async-send"
          - crate: hadris-cpio
            tier: std
            features: "std,sync"
          - crate: hadris-cpio
            tier: hosted-async
            features: "std,async"
          - crate: hadris-cpio
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send"

          # hadris-cd
          - crate: hadris-cd
            tier: no-api
            features: ""
          - crate: hadris-cd
            tier: no-std-sync
            features: "sync"
          - crate: hadris-cd
            tier: no-std-async-send
            features: "async-send"
          - crate: hadris-cd
            tier: std
            features: "std,sync"
          - crate: hadris-cd
            tier: hosted-async
            features: "std,async"
          - crate: hadris-cd
            tier: all-capabilities
            features: "std,sync,async,async-send"

          # hadris-ntfs
          - crate: hadris-ntfs
            tier: no-std-sync
            features: "sync"
          - crate: hadris-ntfs
            tier: no-std-async
            features: "async"
          - crate: hadris-ntfs
            tier: no-std-async-send
            features: "async-send"
          - crate: hadris-ntfs
            tier: alloc-sync
            features: "alloc,sync"
          - crate: hadris-ntfs
            tier: std
            features: "std,sync"
          - crate: hadris-ntfs
            tier: hosted-async
            features: "std,async"
          - crate: hadris-ntfs
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send"

          # detection and opening facades
          - crate: hadris-block
            tier: no-api
            features: ""
          - crate: hadris-block
            tier: no-std-sync
            features: "sync"
          - crate: hadris-block
            tier: no-std-async
            features: "async"
          - crate: hadris-block
            tier: no-alloc-async-send
            features: "async-send,write,part"
          - crate: hadris-block
            tier: alloc-async
            features: "alloc,async,part"
          - crate: hadris-block
            tier: std
            features: "std,sync,write,part"
          - crate: hadris-block
            tier: unstable-ntfs
            features: "sync,unstable-ntfs"
          - crate: hadris-block
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send,write,part,unstable-ntfs"
          - crate: hadris-optical
            tier: no-api
            features: ""
          - crate: hadris-optical
            tier: no-std-sync
            features: "sync"
          - crate: hadris-optical
            tier: no-std-async
            features: "async"
          - crate: hadris-optical
            tier: no-std-async-send
            features: "async-send"
          - crate: hadris-optical
            tier: alloc-sync
            features: "alloc,sync"
          - crate: hadris-optical
            tier: std
            features: "std,sync"
          - crate: hadris-optical
            tier: hosted-async-with-cd
            features: "std,async,cd"
          - crate: hadris-optical
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send,cd"

          # hadris umbrella forwarding
          - crate: hadris
            tier: no-formats
            features: ""
          - crate: hadris
            tier: no-std-sync-core
            features: "sync"
          - crate: hadris
            tier: leaf-fat
            features: "std,sync,write,fat"
          - crate: hadris
            tier: leaf-part
            features: "std,sync,part"
          - crate: hadris
            tier: leaf-ntfs
            features: "sync,unstable-ntfs"
          - crate: hadris
            tier: leaf-iso
            features: "std,sync,iso"
          - crate: hadris
            tier: leaf-udf
            features: "std,sync,udf"
          - crate: hadris
            tier: leaf-cd
            features: "std,cd"
          - crate: hadris
            tier: leaf-cpio
            features: "std,sync,cpio"
          - crate: hadris
            tier: no-std-block
            features: "sync,block"
          - crate: hadris
            tier: no-std-async-send-block
            features: "async-send,block"
          - crate: hadris
            tier: hosted-async-optical
            features: "std,async,optical"
          - crate: hadris
            tier: dual-mode-archive
            features: "alloc,sync,async,archive"
          - crate: hadris
            tier: all-capabilities
            features: "std,alloc,sync,async,async-send,write,block,optical,archive,unstable-ntfs"

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check ${{ matrix.crate }} with features "${{ matrix.features }}"
        run: cargo check -p ${{ matrix.crate }} --no-default-features --features "${{ matrix.features }}"

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run all-feature tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-features --tests
      # `hadris-fat/defmt` is an embedded logging integration. It can be
      # type-checked on every host, but its runtime symbols are supplied by an
      # embedded target and therefore cannot be linked into Windows test
      # executables. The feature matrix above still checks the complete feature
      # combination; Windows exercises the portable hosted defaults here.
      - name: Run portable hosted tests
        if: runner.os == 'Windows'
        run: |
          cargo test --workspace --all-features --tests --exclude hadris-fat
          cargo test -p hadris-fat --features "std,alloc,sync,async,async-send,write,unstable-exfat" --tests
      - name: Run block opening integration tests
        run: cargo test -p hadris-block --all-features --test open_volume --test async_volume --test async_send_volume
      - name: Run optical detection integration tests
        run: cargo test -p hadris-optical --all-features --test detect
      - name: Run optical opening integration tests
        run: cargo test -p hadris-optical --all-features --test open_image --test async_open_image
      - name: Run CPIO async writer integration test
        run: cargo test -p hadris-cpio --all-features --test async_writer

  test-exfat:
    name: Test exFAT (with external tools)
    runs-on: ubuntu-latest
    env:
      HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install exfatprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs
      - name: Run exFAT tests against fsck.exfat and mkfs.exfat
        run: |
          cargo test -p hadris-fat --features "std,sync,async-send,write,unstable-exfat" \
            --test exfat_read --test exfat_write --test exfat_format --test exfat_check \
            --test exfat_contract --test exfat_native -- --nocapture

  test-ntfs:
    name: Test NTFS (with ntfsprogs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install ntfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g
      # Tests that populate a volume through an ntfs-3g FUSE mount skip
      # without FUSE permissions; scripts/test-ntfs.sh runs them all.
      - name: Run NTFS tests against mkntfs volumes
        run: cargo test -p hadris-ntfs --all-features -- --nocapture

  test-fat-conformance:
    name: Test FAT conformance and interoperability
    runs-on: ubuntu-latest
    env:
      HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install FAT image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools
      - name: Run test harness unit tests
        run: "cargo test --manifest-path tests/Cargo.toml --lib"
      - name: Run FAT conformance and interoperability tests
        run: "cargo test --manifest-path tests/Cargo.toml fat:: -- --nocapture"

  test-optical:
    name: Test optical interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install optical image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso udftools p7zip-full libarchive-tools
      - name: Run ISO conformance and interoperability tests
        env:
          HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
        run: "cargo test --manifest-path tests/Cargo.toml iso:: -- --nocapture"
      - name: Run UDF interoperability tests
        env:
          HADRIS_REQUIRE_EXTERNAL_TOOLS: "1"
        run: cargo test -p hadris-udf --all-features --test interop -- --nocapture
      - name: Qualify hybrid ISO/UDF images
        run: cargo test -p hadris-cd --all-features --test bridge -- --nocapture

  # CLI --help/--version smoke tests live in crates/tools/hadris-*-cli/tests/cli_smoke.rs
  # and run under the workspace `test` job.

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc --workspace
        run: cargo doc --workspace --no-deps
      - name: Compile rustdoc examples
        run: cargo test --workspace --all-features --doc
      - name: Compile Cargo example targets
        run: cargo check --workspace --all-features --examples

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check conformance suite formatting
        run: cargo fmt --manifest-path tests/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests -> target
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run clippy on conformance suite
        run: cargo clippy --manifest-path tests/Cargo.toml --all-targets -- -D warnings

  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    # Miri runs Rust through an interpreter to catch undefined behavior at
    # runtime. We only point it at focused unit tests that exercise
    # historically-unsafe code paths (see issues #26 and #28). Miri is too slow
    # — and too restricted (no real I/O) — to run the full test suite, but
    # these targeted tests catch regressions cheaply.
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain with miri
        run: |
          rustup toolchain install nightly --component miri
          rustup +nightly component add miri
      - name: Setup miri
        run: cargo +nightly miri setup
      - uses: Swatinem/rust-cache@v2
      - name: Miri — hadris-common (FixedFilename safety)
        run: cargo +nightly miri test -p hadris-common --lib
      - name: Miri - hadris-fat (LFN UTF-16, surrogate pairs and name decoding)
        run: "cargo +nightly miri test -p hadris-fat --lib codec::"
      - name: Miri - hadris-iso (on-disk layouts, name and Rock Ridge decoding)
        run: "cargo +nightly miri test -p hadris-iso --lib -- raw:: name:: rock_ridge::"
      - name: Miri - hadris-part (on-disk layouts, CRC, UTF-16 partition names)
        run: cargo +nightly miri test -p hadris-part --lib
      - name: Miri - hadris-ntfs (records, mapping pairs, UTF-16 names)
        run: cargo +nightly miri test -p hadris-ntfs --lib
