name: Release

# Releases one or more published crates at the versions in their manifests.
# scripts/release-plan.py orders them, derives each tag (<crate>-v<version>)
# and reads the release notes from CHANGELOG.md. See CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      crates:
        description: Crates to release, separated by spaces, or all
        required: true
        default: all
        type: string
      notes:
        description: CHANGELOG section for every crate (such as 3.0.0-rc.1); empty uses "<crate> <version>"
        required: false
        default: ""
        type: string
      mode:
        description: Validate packages or publish the release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ inputs.mode }} ${{ inputs.crates }}
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      # Publishing several unpublished crates that depend on one another
      # needs a newer Cargo than the 1.88 MSRV.
      - name: Install stable Cargo for packaging
        run: rustup toolchain install stable --profile minimal

      - name: Plan the release
        id: plan
        env:
          CRATES: ${{ inputs.crates }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/next" ]]; then
            echo "Releases run from main or next, not $GITHUB_REF" >&2
            exit 1
          fi
          read -ra crates <<< "$CRATES"
          plan="$(python3 scripts/release-plan.py --notes "$NOTES" "${crates[@]}")"
          echo "$plan"
          {
            echo "plan<<EOF"
            echo "$plan"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check workspace
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Package and verify the crates
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while read -r name _ _; do
            args+=(-p "$name")
          done <<< "$PLAN"
          cargo +stable publish --locked --dry-run "${args[@]}"

      - name: Publish crates
        if: inputs.mode == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PLAN: ${{ steps.plan.outputs.plan }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "The CARGO_REGISTRY_TOKEN secret is required" >&2
            exit 1
          fi

          agent="hadris-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)"
          crate_exists() {
            curl --fail --silent --user-agent "$agent" \
              "https://crates.io/api/v1/crates/$1/$2" > /dev/null 2>&1
          }

          # A rerun resumes a partial publication: crates already on
          # crates.io at this version are left out.
          args=()
          while read -r name version _; do
            if crate_exists "$name" "$version"; then
              echo "$name $version is already published; skipping"
            else
              args+=(-p "$name")
            fi
          done <<< "$PLAN"
          if (( ${#args[@]} )); then
            # Cargo publishes in dependency order and waits for each crate
            # to reach the index before publishing its dependents.
            cargo +stable publish --locked "${args[@]}"
          fi

  github-release:
    name: Tag and create GitHub releases
    if: inputs.mode == 'publish'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - name: Tag and create releases
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES: ${{ inputs.crates }}
          NOTES: ${{ inputs.notes }}
          PLAN: ${{ needs.release.outputs.plan }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra crates <<< "$CRATES"
          python3 scripts/release-plan.py --notes "$NOTES" --notes-dir release-notes "${crates[@]}" > /dev/null

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          new_tags=()
          while read -r name version tag; do
            if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
              if [[ $(git rev-list -n 1 "$tag") != "$GITHUB_SHA" ]]; then
                echo "$tag already exists on a different commit" >&2
                exit 1
              fi
            else
              git tag --annotate "$tag" --message "$name $version"
              new_tags+=("$tag")
            fi
          done <<< "$PLAN"
          if (( ${#new_tags[@]} )); then
            git push origin "${new_tags[@]}"
          fi

          while read -r name version tag; do
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "GitHub release $tag already exists; skipping"
              continue
            fi
            flags=(--latest=false)
            if [[ "$version" == *-* ]]; then
              flags=(--prerelease --latest=false)
            elif [[ "$name" == hadris ]]; then
              flags=(--latest)
            fi
            gh release create "$tag" \
              --verify-tag \
              --title "$name $version" \
              --notes-file "release-notes/$name.md" \
              "${flags[@]}"
          done <<< "$PLAN"
      # Tags and releases made with GITHUB_TOKEN do not trigger workflows,
      # so rebuild the versioned documentation site explicitly.
      - name: Rebuild the documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=main
          if git ls-remote --exit-code --heads origin next > /dev/null; then
            branch=next
          fi
          gh workflow run docs.yml --ref "$branch"
