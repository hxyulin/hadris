name: Release

# Releases one or more published crates at the versions in their manifests.
# scripts/release-plan.py orders them, derives each tag (<crate>-v<version>)
# and reads the release notes from CHANGELOG.md. Joint releases including
# hadris also create a workspace release (v<version>). See CONTRIBUTING.md.
#
# Publishing requires a successful push run of Rust CI (and of V3 guardrails,
# when it ran) for the commit, and builds every CLI release target before any
# crate reaches crates.io. Only the `publish` job, in the `release`
# environment, can read crates.io credentials.

on:
  workflow_dispatch:
    inputs:
      crates:
        description: Crates to release, separated by spaces, or all
        required: true
        default: all
        type: string
      notes:
        description: CHANGELOG section for every crate (such as 3.0.0-rc.2); empty uses "<crate> <version>"
        required: false
        default: ""
        type: string
      mode:
        description: Validate packages, publish the release, or backfill CLI assets
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
          - cli-assets
      cli-tag:
        description: Existing hadris-cli-v<version> release to backfill (cli-assets mode)
        required: false
        default: ""
        type: string
      cli-workspace-tag:
        description: Optional existing v<version> release to mirror backfilled CLI assets
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Releases run from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases run from main, not $GITHUB_REF" >&2
            exit 1
          fi

  release:
    needs: guard
    if: inputs.mode != 'cli-assets'
    name: Plan and verify the release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      github_plan: ${{ steps.plan.outputs.github_plan }}
      cli_tag: ${{ steps.plan.outputs.cli_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Plan the release
        id: plan
        env:
          CRATES: ${{ inputs.crates }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra crates <<< "$CRATES"
          plan="$(python3 scripts/release-plan.py --notes "$NOTES" "${crates[@]}")"
          github_plan="$(python3 scripts/release-plan.py --github-plan --notes "$NOTES" "${crates[@]}")"
          echo "$plan"
          {
            echo "plan<<EOF"
            echo "$plan"
            echo "EOF"
            echo "github_plan<<EOF"
            echo "$github_plan"
            echo "EOF"
            echo "cli_tag=$(awk '$1 == "hadris-cli" {print $3}' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"

      # The full CI matrix (semver, MSRV tiers, Windows and macOS, Miri,
      # interoperability) runs on the push to main, not here.
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          require() {
            local run state conclusion url
            if ! run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')"; then
              echo "$1: could not query the runs for $GITHUB_SHA"
              status=1
              return 0
            fi
            if [[ -z "$run" ]]; then
              echo "$1: no push run for $GITHUB_SHA"
              [[ "$2" == optional ]] || status=1
              return 0
            fi
            read -r state conclusion url <<< "$run"
            echo "$1: $state, $conclusion ($url)"
            if [[ "$state" != completed || "$conclusion" != success ]]; then
              status=1
            fi
          }
          require rust.yml required
          require v3-guardrails.yml optional
          if (( status )); then
            if [[ "$MODE" == publish ]]; then
              echo "::error::CI has not passed for $GITHUB_SHA; wait for it or fix main before publishing"
              exit 1
            fi
            echo "::warning::CI has not passed for $GITHUB_SHA yet; publish mode will refuse this commit"
          fi

      - name: Check workspace
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Package and verify the crates
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while read -r name _ _; do
            args+=(-p "$name")
          done <<< "$PLAN"
          cargo publish --locked --dry-run "${args[@]}"

  cli-build:
    name: Build unified CLI binaries
    needs: release
    if: needs.release.outputs.cli_tag != ''
    cache-mode: none
    # cli-release.yml's upload job asks for contents: write, and GitHub checks
    # nested permissions before the stage condition skips it. Its plan and
    # build jobs keep the workflow-level contents: read.
    permissions:
      contents: write
    uses: ./.github/workflows/cli-release.yml
    with:
      stage: build

  publish:
    name: Publish crates
    needs: [release, cli-build]
    if: >-
      always() && !cancelled() && inputs.mode == 'publish' &&
      needs.release.result == 'success' &&
      (needs.cli-build.result == 'success' || needs.cli-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      # Trusted publishing needs every crate to exist on crates.io with this
      # workflow configured as its publisher; until then the repository
      # variable stays unset and the CARGO_REGISTRY_TOKEN secret is used.
      - name: Get a crates.io token through trusted publishing
        id: auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          PLAN: ${{ needs.release.outputs.plan }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "A crates.io token is required: trusted publishing or the CARGO_REGISTRY_TOKEN secret" >&2
            exit 1
          fi

          agent="hadris-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)"
          # Succeeds when crates.io has the version, fails when it does not,
          # and stops the job when crates.io cannot tell.
          published() {
            local attempt code
            for attempt in 1 2 3 4 5; do
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --user-agent "$agent" "https://crates.io/api/v1/crates/$1/$2" || true)"
              case "$code" in
                200) return 0 ;;
                404) return 1 ;;
              esac
              echo "crates.io answered $code for $1 $2; retrying" >&2
              sleep $((attempt * 10))
            done
            echo "could not tell whether $1 $2 is on crates.io" >&2
            exit 1
          }

          # A rerun resumes a partial publication: crates already on
          # crates.io at this version are left out.
          args=()
          while read -r name version _; do
            if published "$name" "$version"; then
              echo "$name $version is already published; skipping"
            else
              args+=(-p "$name")
            fi
          done <<< "$PLAN"
          if (( ${#args[@]} )); then
            # The release job verified these packages from this commit.
            # Cargo publishes in dependency order and waits for each crate
            # to reach the index before publishing its dependents.
            cargo publish --locked --no-verify "${args[@]}"
          fi

  github-release:
    name: Tag and create GitHub releases
    needs: [release, publish]
    if: always() && !cancelled() && inputs.mode == 'publish' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - name: Tag and create releases
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES: ${{ inputs.crates }}
          NOTES: ${{ inputs.notes }}
          PLAN: ${{ needs.release.outputs.github_plan }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra crates <<< "$CRATES"
          python3 scripts/release-plan.py --github-plan --notes "$NOTES" --notes-dir release-notes "${crates[@]}" > /dev/null

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          new_tags=()
          while read -r name version tag; do
            if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
              if [[ $(git rev-list -n 1 "$tag") != "$GITHUB_SHA" ]]; then
                echo "$tag already exists on a different commit" >&2
                exit 1
              fi
            else
              git tag --annotate "$tag" --message "$name $version"
              new_tags+=("$tag")
            fi
          done <<< "$PLAN"
          if (( ${#new_tags[@]} )); then
            git push origin "${new_tags[@]}"
          fi

          latest_tag="$(awk '$1 == "hadris" || $1 == "Hadris" {tag=$3} END {print tag}' <<< "$PLAN")"
          while read -r name version tag; do
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "GitHub release $tag already exists; skipping"
              continue
            fi
            flags=(--latest=false)
            if [[ "$version" == *-* ]]; then
              flags=(--prerelease --latest=false)
            elif [[ "$tag" == "$latest_tag" ]]; then
              flags=(--latest)
            fi
            gh release create "$tag" \
              --verify-tag \
              --title "$name $version" \
              --notes-file "release-notes/$name.md" \
              "${flags[@]}"
          done <<< "$PLAN"
      # Tags and releases made with GITHUB_TOKEN do not trigger workflows,
      # so rebuild the versioned documentation site explicitly.
      - name: Rebuild the documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run docs.yml --ref main

  # Publish mode attaches the binaries cli-build made from this commit;
  # cli-assets mode rebuilds an existing release from its tag.
  cli-assets:
    name: Upload unified CLI binaries
    cache-mode: none
    needs: [guard, release, github-release]
    if: >-
      always() && !cancelled() && needs.guard.result == 'success' &&
      (inputs.mode == 'cli-assets' ||
      (inputs.mode == 'publish' && needs.github-release.result == 'success' && needs.release.outputs.cli_tag != ''))
    permissions:
      contents: write
    uses: ./.github/workflows/cli-release.yml
    with:
      stage: ${{ inputs.mode == 'cli-assets' && 'all' || 'upload' }}
      tag: ${{ inputs.mode == 'cli-assets' && inputs.cli-tag || needs.release.outputs.cli_tag }}
      workspace-tag: ${{ inputs.mode == 'cli-assets' && inputs.cli-workspace-tag || '' }}
