<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Hadris architecture</title>
  <desc id="description">Applications use the Hadris umbrella crate, which exposes block, optical, and archive format crates built on shared I/O, path, and storage abstractions.</desc>
  <style>
    text {
      fill: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-anchor: middle;
    }

    .title {
      font-size: 19px;
      font-weight: 650;
    }

    .detail {
      fill: #5b6475;
      font-size: 14px;
    }

    .surface {
      fill: #ffffff;
      stroke: #aeb7c6;
      stroke-width: 1.5;
    }

    .soft {
      fill: #f5f7fa;
      stroke: #aeb7c6;
      stroke-width: 1.5;
    }

    .connector {
      fill: none;
      stroke: #aeb7c6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .arrow-head {
      fill: #aeb7c6;
    }

    .umbrella {
      fill: #0f766e;
    }

    .umbrella-text {
      fill: #ffffff;
    }

    .foundation {
      fill: #e6fffb;
      stroke: #5eead4;
      stroke-width: 1.5;
    }

    @media (prefers-color-scheme: dark) {
      text { fill: #edf2f7; }
      .detail { fill: #aeb8c8; }
      .surface { fill: #182131; stroke: #526075; }
      .soft { fill: #111827; stroke: #526075; }
      .connector { stroke: #526075; }
      .arrow-head { fill: #526075; }
      .umbrella { fill: #0f766e; }
      .umbrella-text { fill: #ffffff; }
      .foundation { fill: #103b3c; stroke: #2dd4bf; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path class="arrow-head" d="M 0 0 L 8 4 L 0 8 Z"/>
    </marker>
  </defs>

  <rect class="soft" x="130" y="20" width="700" height="72" rx="12"/>
  <text class="title" x="480" y="50">Applications</text>
  <text class="detail" x="480" y="73">Bootloaders · kernels · firmware · embedded systems</text>

  <path class="connector" d="M 480 92 V 124" marker-end="url(#arrow)"/>

  <rect class="umbrella" x="325" y="128" width="310" height="68" rx="10"/>
  <text class="title umbrella-text" x="480" y="157">hadris</text>
  <text class="umbrella-text" x="480" y="179" font-size="14">umbrella crate</text>

  <path class="connector" d="M 480 196 V 222 H 180 V 248 M 480 222 V 248 M 480 222 H 780 V 248"/>

  <g>
    <rect class="surface" x="40" y="248" width="280" height="112" rx="8"/>
    <text class="title" x="180" y="290">hadris-block</text>
    <text class="detail" x="180" y="318">FAT12 / FAT16 / FAT32</text>
    <text class="detail" x="180" y="340">GPT / MBR</text>
  </g>

  <g>
    <rect class="surface" x="340" y="248" width="280" height="112" rx="8"/>
    <text class="title" x="480" y="290">hadris-optical</text>
    <text class="detail" x="480" y="323">ISO 9660 · UDF</text>
  </g>

  <g>
    <rect class="surface" x="640" y="248" width="280" height="112" rx="8"/>
    <text class="title" x="780" y="290">hadris-archive</text>
    <text class="detail" x="780" y="323">CPIO</text>
  </g>

  <path class="connector" d="M 180 360 V 390 H 480 M 780 360 V 390 H 480 M 480 360 V 414" marker-end="url(#arrow)"/>

  <rect class="foundation" x="205" y="418" width="550" height="72" rx="10"/>
  <text class="title" x="480" y="449">Shared foundation</text>
  <text class="detail" x="480" y="473">I/O · paths · storage abstractions</text>

  <path class="connector" d="M 480 490 V 522" marker-end="url(#arrow)"/>

  <rect class="soft" x="280" y="526" width="400" height="54" rx="10"/>
  <text x="480" y="559" font-size="15" font-weight="600">Files · disk images · block devices</text>
</svg>
